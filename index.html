<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9b8ac4">
<style>
:root{
  --bg1:#fde2e2; --bg2:#fff3d6; --bg3:#dff5e1; --bg4:#dceeff; --bg5:#ece1fb;
  --card:#ffffff; --ink:#3d3550; --sub:#8b849c; --line:#eee3f2;
  --accent:#9b8ac4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;min-height:100%;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4),var(--bg5));
  background-attachment:fixed;
}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  border-radius:20px;padding:14px 18px;margin-bottom:16px;
}
.topbar button.nav{background:none;border:none;font-size:20px;color:var(--accent);padding:4px 8px;cursor:pointer;}
.topbar .month{font-weight:700;font-size:18px;text-align:center;}
.card{
  background:var(--card);border-radius:20px;padding:18px 20px;margin-bottom:14px;
  box-shadow:0 6px 18px rgba(80,60,110,.08);
}
.card.total{background:linear-gradient(135deg,#fff,#f6f0ff);}
.cat-row{display:flex;align-items:center;gap:12px;cursor:pointer;}
.dot{width:14px;height:14px;border-radius:50%;flex:none;}
.cat-name{font-weight:700;font-size:15px;flex:1;}
.remain{text-align:right;}
.remain .label{font-size:11px;color:var(--sub);}
.remain .yen{font-size:20px;font-weight:700;}
.remain .yen.over{color:#d9756b;}
.remain .base{font-size:12px;color:#d3cce3;margin-top:2px;}
.total .yen{font-size:28px;}
.addcat{
  display:block;width:100%;padding:14px;border:2px dashed #cabde4;border-radius:16px;
  background:transparent;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;
}
/* detail view */
#detail{display:none;}
.backbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.backbar button{background:none;border:none;font-size:20px;color:var(--accent);cursor:pointer;}
.field{margin-bottom:12px;}
.field label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
.field input{
  width:100%;border:none;border-bottom:2px solid var(--line);padding:8px 2px;
  font-size:16px;background:transparent;color:var(--ink);
}
.field input:focus{outline:none;border-color:var(--accent);}
.colors{display:flex;gap:10px;margin:10px 0 4px;}
.colors .dot{width:26px;height:26px;cursor:pointer;border:2px solid transparent;}
.colors .dot.sel{border-color:var(--ink);}
.row2{display:flex;gap:10px;align-items:center;margin-top:10px;}
.row2 input[type=date]{flex:1;border:none;border-bottom:2px solid var(--line);padding:8px 2px;font-size:14px;background:transparent;color:var(--ink);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;}
.entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry .d{font-size:12px;color:var(--sub);width:70px;}
.entry .n{flex:1;font-size:14px;padding:0 8px;}
.entry .a{font-weight:700;font-size:15px;}
.entry .del{background:none;border:none;color:#d9a0a0;font-size:16px;cursor:pointer;padding:2px 6px;}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:16px 0;}
.trash{background:none;border:none;color:#d9a0a0;font-size:18px;cursor:pointer;}
.preset{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.preset:last-child{border-bottom:none;}
.preset .n{flex:1;font-size:14px;}
.preset .a{font-size:14px;color:var(--sub);width:90px;text-align:right;}
.preset .add{background:var(--accent);color:#fff;border:none;border-radius:10px;width:28px;height:28px;font-size:16px;cursor:pointer;}
.preset .del{background:none;border:none;color:#d9a0a0;font-size:15px;cursor:pointer;}
.presetform{display:flex;gap:8px;margin-top:10px;}
.presetform input{border:none;border-bottom:2px solid var(--line);padding:8px 2px;font-size:14px;background:transparent;color:var(--ink);}
.presetform input.pname{flex:1;}
.presetform input.pamt{width:90px;}
.bulkbtn{margin-top:12px;width:100%;background:transparent;border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;}
.cardtitle{font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:700;}
.pin{letter-spacing:.3em;text-align:center;font-size:22px !important;}
.lkmsg{min-height:18px;font-size:13px;color:#c0577a;margin-top:10px;text-align:center;}
.lkbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.lkbtns .btn,.lkbtns .bulkbtn{width:100%;margin-top:0;}
</style>
</head>
<body>
<div class="wrap" id="appWrap" style="display:none;">

  <div id="home">
    <div class="topbar">
      <button class="nav" onclick="shiftMonth(-1)">◀</button>
      <div class="month" id="monthLabel"></div>
      <button class="nav" onclick="shiftMonth(1)">▶</button>
    </div>

    <div class="card total">
      <div class="cat-row">
        <div class="cat-name" style="font-size:16px;">合計</div>
        <div class="remain">
          <div class="label">残り</div>
          <div class="yen" id="totalRemain">¥0</div>
          <div class="base" id="totalBase"></div>
        </div>
      </div>
    </div>

    <div id="catList"></div>

    <button class="addcat" onclick="addCategory()">+ カテゴリーを追加</button>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="addcat" style="margin-top:0;flex:1;" onclick="showExport()">データを書き出す</button>
      <button class="addcat" style="margin-top:0;flex:1;" onclick="showImport()">データを読み込む</button>
      <button class="addcat" style="margin-top:0;flex:1;" onclick="showAppend()">記録を追記</button>
    </div>
    <div id="ioPanel" style="display:none;margin-top:12px;">
      <textarea id="ioText" rows="8" style="width:100%;font-size:16px;border:2px solid #eee3f2;border-radius:12px;padding:8px;color:#3d3550;background:#fff;"></textarea>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn" id="ioCopyBtn" onclick="copyExport()">コピー</button>
        <button class="btn" id="ioShareBtn" onclick="shareExport()" style="display:none;">共有</button>
        <button class="btn" id="ioImportBtn" onclick="doImport()">取り込む</button>
        <button class="btn" id="ioAppendBtn" onclick="doAppend()" style="display:none;">追加</button>
        <button class="btn" id="ioClipBtn" onclick="appendFromClipboard()" style="display:none;">クリップボードから追加</button>
      </div>
      <div id="ioMsg" style="margin-top:8px;font-size:13px;color:#8b849c;"></div>
    </div>
    <div style="text-align:center;color:#b8afcc;font-size:11px;margin-top:18px;">ver 11/27-a</div>
  </div>

  <div id="detail">
    <div class="backbar">
      <button onclick="goHome()">◀ 戻る</button>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="delHint" style="display:none;font-size:12px;color:#d9756b;">もう一度押すと削除</span>
        <button class="trash" onclick="deleteCategory()">🗑</button>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>カテゴリー名</label>
        <input id="catNameInput" oninput="renameCategory(this.value)">
      </div>
      <div class="field">
        <label>カテゴリーの予算(月額)</label>
        <input id="catBudgetInput" type="number" inputmode="numeric" oninput="rebudgetCategory(this.value)">
      </div>
      <div class="colors" id="colorPicker"></div>
    </div>

    <div class="card">
      <div class="cardtitle">固定費プリセット</div>
      <div id="presetList"></div>
      <div class="presetform">
        <input id="presetName" class="pname" placeholder="例)住宅ローン">
        <input id="presetAmount" class="pamt" type="number" inputmode="numeric" placeholder="金額">
        <button class="btn" onclick="addPreset()">追加</button>
      </div>
      <button class="bulkbtn" onclick="applyAllPresets()">この月にまとめて登録</button>
    </div>

    <div class="card">
      <div class="field">
        <label>支出の名前(任意)</label>
        <input id="expName" placeholder="例)スーパー">
      </div>
      <div class="field">
        <label>金額</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input id="expAmount" type="number" inputmode="numeric" placeholder="0" style="flex:1;min-width:0;">
          <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;margin:0;font-size:12px;color:var(--sub);"><input type="checkbox" id="round5" checked style="width:auto;border:none;padding:0;"> 5円丸め</label>
        </div>
      </div>
      <div class="row2">
        <input id="expDate" type="date">
        <button class="btn" id="expSubmitBtn" onclick="addExpense()">登録</button>
        <button class="btn" id="expCancelBtn" onclick="cancelEdit()" style="display:none;background:#cabde4;">キャンセル</button>
      </div>
    </div>

    <div class="card">
      <div id="entryList"></div>
    </div>

    <div class="card" id="lockSettings">
      <div class="cardtitle">ロック設定</div>
      <div class="lkbtns" id="lsBtns">
        <button class="bulkbtn" id="lsChangeBtn" onclick="lsOpen('change')">暗証番号を変更</button>
        <button class="bulkbtn" id="lsBioBtn" onclick="lsOpen('bio')" style="display:none;"></button>
      </div>
      <div id="lsForm" style="display:none;">
        <div class="field" style="margin-top:8px;"><label>現在の暗証番号</label><input type="password" id="lsCur" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        <div id="lsNewWrap">
          <div class="field"><label>新しい暗証番号(4〜6桁)</label><input type="password" id="lsNew1" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
          <div class="field"><label>新しい暗証番号(確認)</label><input type="password" id="lsNew2" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        </div>
        <div class="lkbtns">
          <button class="btn" id="lsRunBtn" onclick="lsRun()">実行</button>
          <button class="bulkbtn" onclick="lsClose()">キャンセル</button>
        </div>
      </div>
      <div class="lkmsg" id="lsMsg"></div>
    </div>
  </div>

</div>

<div class="wrap" id="lock" style="display:none;">
  <div class="card" style="margin-top:60px;">
    <div class="cardtitle" id="lkTitle" style="text-align:center;font-size:15px;">家計簿</div>
    <div id="lkSetup" style="display:none;">
      <div class="field"><label>暗証番号(4〜6桁の数字)</label><input type="password" id="lkP1" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
      <div class="field"><label>もう一度入力</label><input type="password" id="lkP2" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
      <div class="lkbtns">
        <button class="btn" onclick="lkSetup(false)">暗証番号を設定して開始</button>
        <button class="bulkbtn" id="lkSetBioBtn" onclick="lkSetup(true)" style="display:none;">Face ID を登録</button>
      </div>
    </div>
    <div id="lkUnlock" style="display:none;">
      <div class="field"><label>暗証番号</label><input type="password" id="lkPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
      <div class="lkbtns">
        <button class="btn" onclick="lkUnlock()">解錠</button>
        <button class="bulkbtn" id="lkBioBtn" onclick="tryBio()" style="display:none;">Face ID で解錠</button>
      </div>
    </div>
    <div class="lkmsg" id="lkMsg"></div>
  </div>
</div>

<script>
const COLORS=["#f6d98a","#a7c8f2","#f2a7c3","#a9e3c0","#f2b8b0","#b7a7e0"];
const LS_KEY="kakeibo_data_v1";
let data=load();
let curYear, curMonth; // curMonth 0-11
let openCatId=null;

function load(){
  let raw=null;
  try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{ return JSON.parse(raw); }
    catch(e){
      try{ localStorage.setItem("kakeibo_data_v1_broken", raw); }catch(e2){}
    }
  }
  return {categories:[
    {id:cid(),name:"生活費",budget:280000,color:COLORS[0]},
    {id:cid(),name:"使う分",budget:70000,color:COLORS[1]}
  ],expenses:[]};
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}
function todayStr(){
  const d=new Date();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function cid(){ return "c"+Date.now()+Math.random().toString(16).slice(2,6); }

// 月ごとの予算(budgetHistory があれば月に応じた額、なければ budget)
function budgetFor(cat){
  const mk=monthKey();
  if(!cat.budgetHistory || !cat.budgetHistory.length) return Number(cat.budget)||0;
  let amt=cat.budgetHistory[0].amount;
  cat.budgetHistory.forEach(h=>{ if(h.from<=mk) amt=h.amount; });
  return Number(amt)||0;
}

function initMonth(){
  const now=new Date();
  curYear=now.getFullYear(); curMonth=now.getMonth();
}
function shiftMonth(d){
  curMonth+=d;
  if(curMonth<0){curMonth=11;curYear--;}
  if(curMonth>11){curMonth=0;curYear++;}
  renderHome();
}
function monthKey(){ return curYear+"-"+String(curMonth+1).padStart(2,"0"); }
function monthLabelText(){ return curYear+"年"+(curMonth+1)+"月"; }

function expensesFor(catId){
  const mk=monthKey();
  return data.expenses.filter(e=>e.categoryId===catId && e.date.slice(0,7)===mk);
}
function spentFor(catId){
  return expensesFor(catId).reduce((s,e)=>s+Number(e.amount),0);
}

function renderHome(){
  document.getElementById("monthLabel").textContent=monthLabelText();
  const list=document.getElementById("catList");
  list.innerHTML="";
  let totalBudget=0, totalSpent=0;
  data.categories.forEach(cat=>{
    const spent=spentFor(cat.id);
    const b=budgetFor(cat);
    const remain=b-spent;
    totalBudget+=b; totalSpent+=spent;
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="cat-row" onclick="openCategory('${cat.id}')">
        <div class="dot" style="background:${cat.color}"></div>
        <div class="cat-name">${escapeHtml(cat.name)}</div>
        <div class="remain">
          <div class="label">残り</div>
          <div class="yen ${remain<0?'over':''}">¥${remain.toLocaleString()}</div>
          <div class="base">(¥${b.toLocaleString()})</div>
        </div>
      </div>`;
    list.appendChild(card);
  });
  const totalRemainEl=document.getElementById("totalRemain");
  const totalRemainVal=totalBudget-totalSpent;
  totalRemainEl.textContent="¥"+totalRemainVal.toLocaleString();
  totalRemainEl.className="yen"+(totalRemainVal<0?" over":"");
  document.getElementById("totalBase").textContent="(¥"+totalBudget.toLocaleString()+")";
  document.getElementById("home").style.display="block";
  document.getElementById("detail").style.display="none";
}

function addCategory(){
  const cat={id:cid(),name:"新しいカテゴリー",budget:0,color:COLORS[data.categories.length%COLORS.length]};
  data.categories.push(cat);
  save();
  openCategory(cat.id);
}

function openCategory(id){
  openCatId=id;
  resetEditMode();
  resetDelete();
  const cat=data.categories.find(c=>c.id===id);
  document.getElementById("catNameInput").value=cat.name;
  document.getElementById("catBudgetInput").value=budgetFor(cat);
  document.getElementById("expName").value="";
  document.getElementById("expAmount").value="";
  document.getElementById("expDate").value=todayStr();

  const cp=document.getElementById("colorPicker");
  cp.innerHTML="";
  COLORS.forEach(c=>{
    const d=document.createElement("div");
    d.className="dot"+(c===cat.color?" sel":"");
    d.style.background=c;
    d.onclick=()=>{cat.color=c; save(); openCategory(id);};
    cp.appendChild(d);
  });

  renderPresets();
  renderEntries();
  document.getElementById("home").style.display="none";
  document.getElementById("detail").style.display="block";
}
function goHome(){ resetDelete(); save(); renderHome(); }

function renderPresets(){
  const cat=data.categories.find(c=>c.id===openCatId);
  if(!cat.presets) cat.presets=[];
  const list=document.getElementById("presetList");
  if(cat.presets.length===0){
    list.innerHTML='<div class="empty">プリセットはまだありません</div>';
    return;
  }
  list.innerHTML=cat.presets.map(p=>`
    <div class="preset">
      <div class="n">${escapeHtml(p.name)}</div>
      <div class="a">¥${Number(p.amount).toLocaleString()}</div>
      <button class="add" onclick="usePreset('${p.id}')">+</button>
      <button class="del" onclick="deletePreset('${p.id}')">✕</button>
    </div>`).join("");
}
function addPreset(){
  const name=document.getElementById("presetName").value.trim();
  const amount=Number(document.getElementById("presetAmount").value);
  if(!name || !amount) return;
  const cat=data.categories.find(c=>c.id===openCatId);
  if(!cat.presets) cat.presets=[];
  cat.presets.push({id:cid(),name,amount});
  save();
  document.getElementById("presetName").value="";
  document.getElementById("presetAmount").value="";
  renderPresets();
}
function deletePreset(id){
  const cat=data.categories.find(c=>c.id===openCatId);
  cat.presets=cat.presets.filter(p=>p.id!==id);
  save();
  renderPresets();
}
function usePreset(id){
  const cat=data.categories.find(c=>c.id===openCatId);
  const p=cat.presets.find(p=>p.id===id);
  const date=document.getElementById("expDate").value || todayStr();
  const ex={id:cid(),categoryId:openCatId,name:p.name,amount:p.amount,date};
  if(isProvisionalName(p.name)) ex.provisional=true;
  data.expenses.push(ex);
  save();
  renderEntries();
}
function isProvisionalName(n){ return /^(水道|電気|ガス)/.test(String(n||"")); }
function applyAllPresets(){
  const cat=data.categories.find(c=>c.id===openCatId);
  if(!cat.presets || cat.presets.length===0) return;
  const date=document.getElementById("expDate").value || todayStr();
  cat.presets.forEach(p=>{
    const dup=data.expenses.some(e=>e.categoryId===openCatId && e.name===p.name && String(e.date).slice(0,7)===date.slice(0,7));
    if(dup) return;
    const ex={id:cid(),categoryId:openCatId,name:p.name,amount:p.amount,date};
    if(isProvisionalName(p.name)) ex.provisional=true;
    data.expenses.push(ex);
  });
  save();
  renderEntries();
}

function renameCategory(v){
  const cat=data.categories.find(c=>c.id===openCatId);
  cat.name=v; save();
}
function rebudgetCategory(v){
  const cat=data.categories.find(c=>c.id===openCatId);
  const val=Number(v)||0;
  cat.budget=val;
  if(cat.budgetHistory){
    const mk=monthKey();
    const h=cat.budgetHistory.find(x=>x.from===mk);
    if(h) h.amount=val; else cat.budgetHistory.push({from:mk,amount:val});
    cat.budgetHistory.sort((a,b)=>a.from<b.from?-1:1);
  }
  save();
}
let deletePending=false;
function resetDelete(){
  deletePending=false;
  const h=document.getElementById("delHint");
  if(h) h.style.display="none";
}
function deleteCategory(){
  if(!deletePending){
    deletePending=true;
    document.getElementById("delHint").style.display="inline";
    return;
  }
  resetDelete();
  data.categories=data.categories.filter(c=>c.id!==openCatId);
  data.expenses=data.expenses.filter(e=>e.categoryId!==openCatId);
  save();
  goHome();
}

let editingId=null;
function resetEditMode(){
  editingId=null;
  document.getElementById("expSubmitBtn").textContent="登録";
  document.getElementById("expCancelBtn").style.display="none";
}
function cancelEdit(){
  resetEditMode();
  document.getElementById("expName").value="";
  document.getElementById("expAmount").value="";
  document.getElementById("expDate").value=todayStr();
}
function editExpense(id){
  const e=data.expenses.find(x=>x.id===id);
  if(!e) return;
  editingId=id;
  document.getElementById("expName").value=e.name||"";
  document.getElementById("expAmount").value=e.amount;
  document.getElementById("expDate").value=e.date;
  document.getElementById("expSubmitBtn").textContent="更新";
  document.getElementById("expCancelBtn").style.display="inline-block";
}
function addExpense(){
  let amount=Number(document.getElementById("expAmount").value);
  if(!amount){ return; }
  if(document.getElementById("round5").checked) amount=Math.round(amount/5)*5;
  const name=document.getElementById("expName").value.trim();
  const date=document.getElementById("expDate").value || todayStr();
  if(editingId){
    const e=data.expenses.find(x=>x.id===editingId);
    if(e){
      e.name=name; e.amount=amount; e.date=date;
      delete e.provisional;
    }
    save();
    cancelEdit();
    renderEntries();
    return;
  }
  data.expenses.push({id:cid(),categoryId:openCatId,name,amount,date});
  save();
  document.getElementById("expName").value="";
  document.getElementById("expAmount").value="";
  renderEntries();
}
function deleteExpense(id){
  if(editingId===id) cancelEdit();
  data.expenses=data.expenses.filter(e=>e.id!==id);
  save();
  renderEntries();
}

function renderEntries(){
  const list=document.getElementById("entryList");
  const items=expensesFor(openCatId).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(items.length===0){
    list.innerHTML='<div class="empty">この月の記録はまだありません</div>';
    return;
  }
  list.innerHTML=items.map(e=>{
    const d=new Date(e.date+"T00:00:00");
    const wd=["日","月","火","水","木","金","土"][d.getDay()];
    return `<div class="entry" style="cursor:pointer;" onclick="editExpense('${e.id}')">
      <div class="d">${d.getMonth()+1}/${d.getDate()}(${wd})</div>
      <div class="n">${escapeHtml(e.name||"")}${e.provisional?"(仮)":""}</div>
      <div class="a">¥${Number(e.amount).toLocaleString()}</div>
      <button class="del" onclick="event.stopPropagation();deleteExpense('${e.id}')">✕</button>
    </div>`;
  }).join("");
}

function doAppend(){
  const ta=document.getElementById("ioText");
  if(appendText(ta.value)) ta.value="";
}
function appendText(text){
  const rows=[], errs=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim()) return;
    const n=i+1;
    const parts=line.split(/[\/,\t]/).map(s=>s.trim());
    if(parts.length!==4){ errs.push(n+"行目: 項目が4つ(日付・店名・金額・カテゴリ)ではありません"); return; }
    const date=parts[0], name=parts[1], amtStr=parts[2], catName=parts[3];
    let okDate=/^\d{4}-\d{2}-\d{2}$/.test(date);
    if(okDate){
      const y=Number(date.slice(0,4)), m=Number(date.slice(5,7)), d=Number(date.slice(8,10));
      const dd=new Date(y,m-1,d);
      okDate=(dd.getFullYear()===y && dd.getMonth()===m-1 && dd.getDate()===d);
    }
    if(!okDate){ errs.push(n+"行目: 日付がYYYY-MM-DD形式の正しい日付ではありません"); return; }
    if(amtStr==="" || !isFinite(Number(amtStr))){ errs.push(n+"行目: 金額が数値ではありません"); return; }
    const cat=data.categories.find(c=>c.name===catName);
    if(!cat){ errs.push(n+"行目: カテゴリ「"+catName+"」が既存カテゴリと一致しません"); return; }
    rows.push({date:date,name:name,amount:Number(amtStr),categoryId:cat.id});
  });
  if(errs.length){ showMsg(errs.join(" ｜ ")); return false; }
  if(!rows.length){ showMsg("追記する行がありません"); return false; }
  const existing=data.expenses.slice();
  let added=0, skipped=0;
  rows.forEach((r,idx)=>{
    const dup=existing.some(e=>e.categoryId===r.categoryId && e.date===r.date && (e.name||"")===r.name && Number(e.amount)===r.amount);
    if(dup){ skipped++; return; }
    data.expenses.push({id:cid()+"_"+idx,categoryId:r.categoryId,name:r.name,amount:r.amount,date:r.date});
    added++;
  });
  save();
  renderHome();
  showMsg(added+"件追加、"+skipped+"件は既存のためスキップ");
  return true;
}
function appendFromClipboard(){
  const ta=document.getElementById("ioText");
  const fail=()=>showMsg("クリップボードを読めませんでした。欄に貼り付けてください");
  try{
    if(!(navigator.clipboard && navigator.clipboard.readText)){ fail(); return; }
    navigator.clipboard.readText().then(t=>{
      ta.value=t||"";
      if(appendText(ta.value)) ta.value="";
    }, fail);
  }catch(e){ fail(); }
}
function copyExport(){
  const ta=document.getElementById("ioText");
  const selectAll=()=>{
    ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
  };
  const fallback=()=>{
    selectAll();
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    if(ok){ showMsg("コピーしました"); return; }
    shareExport();
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>showMsg("コピーしました"), fallback);
    }else{
      fallback();
    }
  }catch(e){ fallback(); }
}
function shareExport(){
  const ta=document.getElementById("ioText");
  if(typeof navigator.share!=="function"){
    showMsg("コピーできませんでした。テキストを選択して手動でコピーしてください");
    return;
  }
  try{
    navigator.share({text:ta.value}).then(()=>showMsg("共有しました"), err=>{
      if(err && err.name==="AbortError") showMsg("共有をキャンセルしました");
      else showMsg("共有できませんでした。テキストを選択して手動でコピーしてください");
    });
  }catch(e){
    showMsg("共有できませんでした。テキストを選択して手動でコピーしてください");
  }
}
let importPending=null;
function showMsg(t){ document.getElementById("ioMsg").textContent=t; }
function resetImport(){
  importPending=null;

}
function doImport(){
  const ta=document.getElementById("ioText");
  if(importPending){
    const parsed=importPending;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(parsed)); }
    catch(e){ resetImport(); showMsg("保存に失敗しました: "+e.message); return; }
    data=parsed;
    resetImport();
    ta.value="";
    renderHome();
    showMsg("読み込みました");
    return;
  }
  const text=ta.value.trim();
  if(!text){ showMsg("JSONが入力されていません"); return; }
  let parsed;
  try{ parsed=JSON.parse(text); }
  catch(e){ showMsg("JSONとして読み込めませんでした: "+e.message); return; }
  if(!parsed || typeof parsed!=="object" || !Array.isArray(parsed.categories) || !Array.isArray(parsed.expenses)){
    showMsg("形式が正しくありません。categories と expenses が配列のデータを貼り付けてください。");
    return;
  }
  importPending=parsed;
  showMsg(parsed.categories.length+"件のカテゴリー・"+parsed.expenses.length+"件の記録を読み込みます。もう一度「取り込む」を押すと現在のデータを置き換えます");
  document.getElementById("ioImportBtn").textContent="本当に置き換える";
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ===== ロック ===== */
const LOCK_KEY="kakeibo_lock";
let locked=true, hiddenAt=0, lockBusy=false, bioOK=false, lsMode="";
const lg=id=>document.getElementById(id);
function lockLoad(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||"null"); }catch(e){ return null; } }
function lockSave(c){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(c)); return localStorage.getItem(LOCK_KEY)!==null; }catch(e){ return false; } }
function b64e(a){ let t=""; a.forEach(x=>t+=String.fromCharCode(x)); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const r=atob(t); const a=new Uint8Array(r.length); for(let i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
async function pinHash(pin,salt){
  const d=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pin));
  return b64e(new Uint8Array(d));
}
const PIN_RE=/^[0-9]{4,6}$/;
async function bioCheck(){
  bioOK=false;
  try{
    if(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get){
      bioOK=PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
        ? await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable() : true;
    }
  }catch(e){ bioOK=false; }
}
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:"家計簿"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)), name:"kakeibo", displayName:"家計簿"},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required"},
    timeout:60000, attestation:"none"
  }});
  return b64e(new Uint8Array(cred.rawId));
}
async function bioAuth(id){
  const r=await navigator.credentials.get({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:"public-key", id:b64d(id), transports:["internal"]}],
    userVerification:"required", timeout:60000
  }});
  return !!r;
}
function lkMsg(t){ lg("lkMsg").textContent=t||""; }
async function showLockScreen(){
  locked=true;
  lg("appWrap").style.display="none";
  lg("lock").style.display="block";
  ["lkP1","lkP2","lkPin"].forEach(i=>lg(i).value="");
  lkMsg("");
  try{
    if(!(window.crypto && crypto.subtle)){ lg("lkSetup").style.display="none"; lg("lkUnlock").style.display="none"; lkMsg("この環境ではロックを利用できません(HTTPS で開いてください)"); return; }
    await bioCheck();
    const cfg=lockLoad();
    if(!cfg || !cfg.hash){
      lg("lkTitle").textContent="暗証番号を設定";
      lg("lkSetup").style.display="block"; lg("lkUnlock").style.display="none";
      lg("lkSetBioBtn").style.display=bioOK?"block":"none";
      lg("lkP1").focus();
    }else{
      lg("lkTitle").textContent="ロック中";
      lg("lkSetup").style.display="none"; lg("lkUnlock").style.display="block";
      const useBio=!!(cfg.cred && bioOK);
      lg("lkBioBtn").style.display=useBio?"block":"none";
      if(useBio) tryBio(); else lg("lkPin").focus();
    }
  }catch(e){ lkMsg("ロック画面を表示できませんでした: "+e.message); }
}
function unlock(){
  locked=false;
  ["lkP1","lkP2","lkPin"].forEach(i=>lg(i).value="");
  lg("lock").style.display="none";
  lg("appWrap").style.display="";
  lsClose(); lg("lsMsg").textContent="";
  lsRefresh();
  runHash();
}
async function tryBio(){
  if(lockBusy) return;
  const cfg=lockLoad();
  if(!cfg || !cfg.cred) return;
  lockBusy=true;
  try{
    if(await bioAuth(cfg.cred)){ lockBusy=false; unlock(); return; }
  }catch(e){
    lkMsg("Face ID で解錠できませんでした。暗証番号を入力してください");
    lg("lkPin").focus();
  }
  lockBusy=false;
}
async function lkSetup(withBio){
  const p1=lg("lkP1").value, p2=lg("lkP2").value;
  if(!PIN_RE.test(p1)){ lkMsg("暗証番号は4〜6桁の数字で入力してください"); return; }
  if(p1!==p2){ lkMsg("2回の入力が一致しません"); return; }
  const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
  const cfg={salt, hash:await pinHash(p1,salt)};
  if(withBio){
    try{ cfg.cred=await bioRegister(); }
    catch(e){ lkMsg("Face ID を登録できませんでした。もう一度試すか、暗証番号のみで開始してください"); return; }
  }
  if(!lockSave(cfg)){ lkMsg("ロック設定を保存できませんでした"); return; }
  unlock();
}
async function lkUnlock(){
  const cfg=lockLoad();
  const p=lg("lkPin").value;
  if(!cfg || !PIN_RE.test(p)){ lkMsg("暗証番号は4〜6桁の数字で入力してください"); return; }
  if(await pinHash(p,cfg.salt)===cfg.hash) unlock();
  else { lkMsg("暗証番号が違います"); lg("lkPin").value=""; }
}
/* ロック設定(詳細画面の最下部) */
function lsRefresh(){
  const cfg=lockLoad()||{};
  const b=lg("lsBioBtn");
  if(cfg.cred){ b.textContent="Face ID の登録を解除"; b.style.display="block"; }
  else if(bioOK){ b.textContent="Face ID を登録"; b.style.display="block"; }
  else b.style.display="none";
}
function lsOpen(mode){
  lsMode=mode==="bio" ? ((lockLoad()||{}).cred ? "unreg" : "reg") : "change";
  ["lsCur","lsNew1","lsNew2"].forEach(i=>lg(i).value="");
  lg("lsNewWrap").style.display=lsMode==="change"?"block":"none";
  lg("lsRunBtn").textContent=lsMode==="change"?"変更する":(lsMode==="unreg"?"登録を解除する":"Face ID を登録する");
  lg("lsBtns").style.display="none";
  lg("lsForm").style.display="block";
  lg("lsMsg").textContent="";
  lg("lsCur").focus();
}
function lsClose(){
  lg("lsForm").style.display="none";
  lg("lsBtns").style.display="flex";
  lsMode="";
}
async function lsRun(){
  const msg=t=>lg("lsMsg").textContent=t;
  const cfg=lockLoad();
  if(!cfg){ msg("ロック設定が見つかりません"); return; }
  const cur=lg("lsCur").value;
  if(!PIN_RE.test(cur) || await pinHash(cur,cfg.salt)!==cfg.hash){ msg("現在の暗証番号が違います"); return; }
  if(lsMode==="change"){
    const n1=lg("lsNew1").value, n2=lg("lsNew2").value;
    if(!PIN_RE.test(n1)){ msg("新しい暗証番号は4〜6桁の数字で入力してください"); return; }
    if(n1!==n2){ msg("新しい暗証番号が一致しません"); return; }
    cfg.salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
    cfg.hash=await pinHash(n1,cfg.salt);
    if(!lockSave(cfg)){ msg("保存できませんでした"); return; }
    lsClose(); msg("暗証番号を変更しました");
  }else if(lsMode==="unreg"){
    delete cfg.cred;
    if(!lockSave(cfg)){ msg("保存できませんでした"); return; }
    lsClose(); lsRefresh(); msg("Face ID の登録を解除しました");
  }else if(lsMode==="reg"){
    try{ cfg.cred=await bioRegister(); }
    catch(e){ msg("Face ID を登録できませんでした"); return; }
    if(!lockSave(cfg)){ msg("保存できませんでした"); return; }
    lsClose(); lsRefresh(); msg("Face ID を登録しました");
  }
}
/* 5分以上バックグラウンドにいたら再ロック */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(!locked && hiddenAt && Date.now()-hiddenAt>=5*60*1000) showLockScreen();
  hiddenAt=0;
});
showLockScreen();
